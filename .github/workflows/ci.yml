name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fixotec
          POSTGRES_PASSWORD: fixotec
          POSTGRES_DB: fixotec
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fixotec -d fixotec"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://fixotec:fixotec@localhost:5432/fixotec
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-validation-0123456789
      SEED_ADMIN_PASSWORD: CiAdmin!2345
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @fixotec/db build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm audit:coverage
      - run: pnpm test
      - name: Migrations apply cleanly and match the schema
        run: |
          pnpm --filter @fixotec/db migrate:deploy
          cd packages/db && npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Seed and run API e2e tests
        run: |
          pnpm db:seed
          pnpm --filter @fixotec/api build
          (cd apps/api && node dist/main.js &) 
          for i in $(seq 1 30); do curl -fsS http://localhost:4000/api/v1/health/ready && break; sleep 2; done
          API_E2E_URL=http://localhost:4000 E2E_PASSWORD="$SEED_ADMIN_PASSWORD" pnpm test:e2e
      - run: pnpm audit --prod --audit-level high

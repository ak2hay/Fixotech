packages:
  - "apps/*"
  - "packages/*"

overrides:
  postcss: ">=8.5.18 <9"
  deepmerge-ts: ">=8.0.0 <9"

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - esbuild
  - msgpackr-extract
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": false
  esbuild: true
  msgpackr-extract: true
  prisma: true

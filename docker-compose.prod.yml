name: fixotec

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    container_name: fixotec-postgres
    environment:
      POSTGRES_USER: fixotec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: fixotec
    volumes:
      - fixotec_pg:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *logging
    shm_size: 256mb
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixotec -d fixotec"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    container_name: fixotec-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - fixotec_redis:/data
    restart: unless-stopped
    logging: *logging
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    image: fixotec-api:current
    container_name: fixotec-api
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://fixotec:${POSTGRES_PASSWORD}@postgres:5432/fixotec
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      API_PORT: "4000"
      STORAGE_ROOT: /app/storage
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4200}:4000"
    volumes:
      - fixotec_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    mem_limit: 1g
    cpus: 1.5
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
  # One-off tooling: `docker compose -f docker-compose.prod.yml run --rm migrate` (or pass a command).
  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    image: fixotec-api:migrate
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://fixotec:${POSTGRES_PASSWORD}@postgres:5432/fixotec
      STORAGE_ROOT: /app/storage
    volumes:
      - fixotec_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

volumes:
  fixotec_pg:
  fixotec_redis:
  fixotec_storage:

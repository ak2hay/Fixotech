services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fixotec
      POSTGRES_PASSWORD: fixotec
      POSTGRES_DB: fixotec
    ports:
      - "5435:5432"
    restart: unless-stopped
    volumes:
      - fixotec_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixotec -d fixotec"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  fixotec_pg:

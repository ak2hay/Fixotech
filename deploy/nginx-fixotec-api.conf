# Fixotec API on a shared VM (included inside nginx's http block from sites-enabled).
# Issue the certificate first with the port 80 block only:
#   certbot certonly --webroot -w /var/www/html -d fixotec-api.95-135-254-46.sslip.io
limit_req_zone $binary_remote_addr zone=fixotec_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=fixotec_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=fixotec_conn:10m;

upstream fixotec_api {
    server 127.0.0.1:4200;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name fixotec-api.95-135-254-46.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fixotec-api.95-135-254-46.sslip.io;

    ssl_certificate /etc/letsencrypt/live/fixotec-api.95-135-254-46.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fixotec-api.95-135-254-46.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:fixotec_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 25m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    limit_conn fixotec_conn 50;
    limit_req_status 429;
    limit_conn_status 429;

    # The API trusts only this hop: overwrite (never append) client-supplied forwarding headers.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location ~ ^/api/v1/auth/(login|mfa/verify|sso|password)$ {
        limit_req zone=fixotec_auth burst=10 nodelay;
        proxy_pass http://fixotec_api;
    }

    # CAD/BIM models: up to CAD_MAX_MB, streamed to the API instead of buffered by nginx.
    location = /api/v1/documents/large {
        client_max_body_size 260m;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        limit_req zone=fixotec_api burst=10 nodelay;
        proxy_pass http://fixotec_api;
    }

    # Large file downloads and zip bundles.
    location ~ ^/api/v1/(.+/download|documents/bundle|public/products/[^/]+/files\.zip)$ {
        proxy_buffering off;
        proxy_read_timeout 1800s;
        limit_req zone=fixotec_api burst=60 nodelay;
        proxy_pass http://fixotec_api;
    }

    location ~ ^/api/v1/health {
        access_log off;
        proxy_pass http://fixotec_api;
    }

    location / {
        limit_req zone=fixotec_api burst=60 nodelay;
        proxy_pass http://fixotec_api;
    }
}
